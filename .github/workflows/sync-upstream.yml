name: Sync upstream

on:
  schedule: [{ cron: "*/30 * * * *" }]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

# A scheduled run and a manual dispatch must not race each other.
concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: latest
        run: echo "version=$(npm view @deepseek-ai/dsh@latest version)" >> "$GITHUB_OUTPUT"
      - name: Validate the upstream tag exists
        env:
          LATEST: ${{ steps.latest.outputs.version }}
        run: |
          git ls-remote --tags https://github.com/deepseek-ai/deepseek-harness.git 'dsh-v*' > /tmp/tags.txt
          node linux/scripts/resolve-upstream.mjs --latest "$LATEST" --tags-file /tmp/tags.txt
      - id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          LATEST: ${{ steps.latest.outputs.version }}
        run: |
          gh release list --limit 200 --json tagName --jq '.[].tagName' > /tmp/releases.txt
          node linux/scripts/decide-sync.mjs --latest "$LATEST" --releases-file /tmp/releases.txt >> "$GITHUB_OUTPUT"
      - name: Check for an in-flight Linux build
        id: inflight
        if: steps.decide.outputs.action == 'build'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          busy=$(gh run list --workflow build-linux.yml --limit 100 --json status \
            --jq 'any(.[]; .status == "queued" or .status == "in_progress")')
          echo "busy=$busy" >> "$GITHUB_OUTPUT"
      - name: Dispatch the Linux build
        # A build for the same version may still be running: skip this tick rather
        # than queue a duplicate that would fail when it tries to publish the tag.
        if: steps.decide.outputs.action == 'build' && steps.inflight.outputs.busy == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # `schedule` events carry only `schedule` in the payload, so
          # `github.event.repository.default_branch` is empty there; the
          # default branch is `github.ref_name` for scheduled runs.
          REF: ${{ github.event.repository.default_branch || github.ref_name }}
          VERSION: ${{ steps.decide.outputs.version }}
        # The build workflow resolves the next unused build number, so a rebuild of
        # the same upstream version never collides with an existing release.
        run: gh workflow run build-linux.yml --ref "$REF" -f version="$VERSION"
      - name: Open or update the sync failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash linux/scripts/issue-on-failure.sh "Upstream sync failed" "$RUN_URL"
